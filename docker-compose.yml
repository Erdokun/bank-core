services:
  postgres:
    image: postgres:16-alpine
    container_name: bank_postgres
    restart: always
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password123
      POSTGRES_DB: bank_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bank_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build: .
    image: veyra-bank-core:local
    container_name: bank_api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://bank_user:bank_password123@postgres:5432/bank_db"
      REDIS_URL: "redis://redis:6379/0"
      APP_ENV: "${APP_ENV:-development}"
      BANK_SANDBOX: "${BANK_SANDBOX:-true}"
      SCHEDULER_EMBEDDED: "false"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_FROM: "${SMTP_FROM:-Veyra <no-reply@veyra.local>}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_TLS: "${SMTP_TLS:-false}"
      SMTP_SSL: "${SMTP_SSL:-false}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:8000}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-development-only-bank-core-key-change-before-deploy}"
    volumes:
      - ./tests:/app/tests:ro
      - ./test_concurrency.py:/app/test_concurrency.py:ro
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: veyra-bank-core:local
    pull_policy: never
    restart: unless-stopped
    init: true
    command: python -m app.worker
    environment:
      DATABASE_URL: "postgresql+asyncpg://bank_user:bank_password123@postgres:5432/bank_db"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; r=redis.from_url(os.environ['REDIS_URL']); assert r.exists('veyra:worker:'+os.environ['HOSTNAME']+':heartbeat')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
